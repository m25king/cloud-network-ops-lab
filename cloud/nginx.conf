events { worker_connections 256; }
http {
  resolver 127.0.0.11 valid=10s ipv6=off;
  log_format lab '$time_iso8601 $request_method $status $request_time $upstream_addr $upstream_status';
  access_log /dev/stdout lab;
  error_log /dev/stderr warn;
  upstream application {
    zone application 64k;
    server app1:8000 resolve max_fails=1 fail_timeout=5s;
    server app2:8000 resolve max_fails=1 fail_timeout=5s;
  }
  server {
    listen 8080;
    server_tokens off;
    location / {
      proxy_pass http://application;
      proxy_connect_timeout 2s;
      proxy_read_timeout 5s;
      # A shared database outage returns an intentional application 503.
      # Preserve it: counting it as a failed peer also breaks /healthz.
      proxy_next_upstream error timeout http_502 http_504;
      proxy_next_upstream_tries 2;
    }
    location = /metrics { return 404; }
  }
}
