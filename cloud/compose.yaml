name: cloud-network-ops-lab
x-logging: &logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'
x-app: &app
  build: .
  environment: &app-env
    DB_DRIVER: mysql
    DB_HOST: db
    DB_USER: lab
    DB_PASSWORD: ${DB_PASSWORD:?Run python scripts/init_env.py first}
    DB_NAME: lab
  depends_on:
    db: {condition: service_healthy}
  healthcheck:
    test: ['CMD', 'python', '-c', "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=4)"]
    interval: 10s
    timeout: 5s
    retries: 3
  read_only: true
  tmpfs: ['/tmp']
  cap_drop: [ALL]
  security_opt: ['no-new-privileges:true']
  restart: unless-stopped
  logging: *logging
  networks: [backend]
services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: lab
      MYSQL_USER: lab
      MYSQL_PASSWORD: ${DB_PASSWORD:?Run python scripts/init_env.py first}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Run python scripts/init_env.py first}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/001.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'MYSQL_PWD="$$MYSQL_PASSWORD" mysql -h 127.0.0.1 -u lab lab -e "SELECT COUNT(*) FROM assets" >/dev/null 2>&1']
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 40s
    restart: unless-stopped
    logging: *logging
    networks: [backend]
  app1:
    <<: *app
    environment:
      <<: *app-env
      INSTANCE_NAME: app1
  app2:
    <<: *app
    environment:
      <<: *app-env
      INSTANCE_NAME: app2
  nginx:
    image: nginx:1.28-alpine
    volumes: ['./nginx.conf:/etc/nginx/nginx.conf:ro']
    ports: ['127.0.0.1:8080:8080']
    depends_on:
      app1: {condition: service_healthy}
      app2: {condition: service_healthy}
    restart: unless-stopped
    logging: *logging
    networks: [backend]
  prometheus:
    image: prom/prometheus:v3.5.0
    command: ['--config.file=/etc/prometheus/prometheus.yml', '--storage.tsdb.retention.time=7d']
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    ports: ['127.0.0.1:9090:9090']
    restart: unless-stopped
    logging: *logging
    networks: [backend]
  alertmanager:
    image: prom/alertmanager:v0.28.1
    volumes: ['./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro']
    ports: ['127.0.0.1:9093:9093']
    restart: unless-stopped
    logging: *logging
    networks: [backend]
  blackbox:
    image: prom/blackbox-exporter:v0.27.0
    command: ['--config.file=/etc/blackbox.yml']
    volumes: ['./monitoring/blackbox.yml:/etc/blackbox.yml:ro']
    restart: unless-stopped
    logging: *logging
    networks: [backend]
  grafana:
    image: grafana/grafana:12.1.1
    environment:
      GF_SECURITY_ADMIN_USER: labadmin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?Run python scripts/init_env.py first}
      GF_USERS_ALLOW_SIGN_UP: 'false'
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ['127.0.0.1:3000:3000']
    restart: unless-stopped
    logging: *logging
    networks: [backend]
networks:
  backend: {}
volumes:
  mysql-data: {}
  prometheus-data: {}
  grafana-data: {}
